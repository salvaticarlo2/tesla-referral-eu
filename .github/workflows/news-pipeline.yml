# News pipeline: RSS -> HTML -> commit -> Netlify deploy.
# Replaces the Hetzner VPS cron (migrated 2026-07-07).
#
# RETIRED 2026-07-24 with the /news/ section. tools/news-pipeline/pipeline.sh
# exits immediately, so every run was a 2m17s no-op that still burned Actions
# minutes. The schedule is removed rather than the file, so reversing the
# retirement is just restoring the cron line below.
name: news-pipeline
on:
  # schedule:
  #   - cron: '0 0,6,12,18 * * *'   # UTC; disabled 2026-07-27, see above
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r tools/news-pipeline/requirements.txt

      - name: Run news pipeline
        run: bash tools/news-pipeline/pipeline.sh

      - name: Commit & push if changed
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: news update $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi

      - name: Verify site reachable
        run: |
          # Checks the homepage. Used to poll /news/, which has returned 410
          # Gone since 2026-07-24, so this step spent 120s timing out on every
          # run before warning about a page that is meant to be gone.
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://teslablog.eu/ || echo 000)
            if [ "$code" = "200" ]; then echo "Site OK (HTTP $code)"; exit 0; fi
            sleep 10
          done
          echo "::warning::teslablog.eu not reachable after 120s"
